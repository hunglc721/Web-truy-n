<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập Admin — WebComics</title>
  <meta name="description" content="Trang đăng nhập hệ thống quản trị WebComics" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f14;
      --card: #1a1d27;
      --border: rgba(255,255,255,0.08);
      --text: #e4e6f0;
      --muted: #7b7f9e;
      --primary: #6c63ff;
      --danger: #ef4444;
      --success: #22c55e;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated background */
    .bg-mesh {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(108,99,255,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 80%, rgba(255,42,109,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 50% 50%, rgba(59,130,246,0.06) 0%, transparent 70%);
    }
    .bg-orb {
      position: fixed; border-radius: 50%; pointer-events: none; filter: blur(60px);
      animation: float 8s ease-in-out infinite;
    }
    .bg-orb-1 { width:300px; height:300px; background:rgba(108,99,255,0.2); top:-80px; left:-80px; animation-delay:0s; }
    .bg-orb-2 { width:250px; height:250px; background:rgba(255,42,109,0.15); bottom:-60px; right:-60px; animation-delay:3s; }
    .bg-orb-3 { width:200px; height:200px; background:rgba(34,197,94,0.1); top:50%; left:50%; transform:translate(-50%,-50%); animation-delay:5s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.05); }
    }
    .bg-orb-3 { animation: float2 10s ease-in-out infinite 5s; }
    @keyframes float2 {
      0%, 100% { transform: translate(-50%,-50%) scale(1); }
      50% { transform: translate(-50%,-60%) scale(1.08); }
    }

    /* Grid dots */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Login box */
    .login-wrap {
      position: relative; z-index: 10;
      width: 90%; max-width: 440px;
      padding: 40px 40px 36px;
      background: rgba(26,29,39,0.85);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
      animation: slide-up .4s ease;
    }
    @keyframes slide-up {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .logo-row {
      display: flex; align-items: center; gap: 12px;
      justify-content: center; margin-bottom: 28px;
    }
    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #6c63ff, #ff2a6d);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 16px; color: #fff;
      box-shadow: 0 4px 16px rgba(108,99,255,0.4);
    }
    .logo-text { font-size: 22px; font-weight: 800; }
    .logo-sub { font-size: 12px; color: var(--muted); font-weight: 500; text-align: center; margin-top: 2px; }

    h1 { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 6px; }
    .sub-text { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 28px; }

    /* Role pills */
    .role-pills { display: flex; gap: 8px; margin-bottom: 24px; }
    .role-pill {
      flex: 1; padding: 9px 8px; border-radius: 9px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--muted); font-size: 12.5px; font-weight: 600;
      cursor: pointer; text-align: center; transition: .2s;
    }
    .role-pill:hover { border-color: var(--primary); color: var(--text); }
    .role-pill.active {
      background: rgba(108,99,255,0.18);
      border-color: rgba(108,99,255,0.5);
      color: var(--primary);
    }
    .role-pill .pill-icon { font-size: 16px; display: block; margin-bottom: 3px; }

    /* Form */
    .fg { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
    input {
      width: 100%; padding: 11px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 9px; color: var(--text);
      font-family: inherit; font-size: 14px; outline: none; transition: .2s;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(108,99,255,0.2); }
    input::placeholder { color: var(--muted); }

    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 44px; }
    .pw-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 16px; padding: 4px; transition: color .2s;
    }
    .pw-toggle:hover { color: var(--text); }

    .err-msg { color: #f87171; font-size: 12px; margin-top: 5px; display: none; }
    .err-msg.show { display: block; }

    .remember-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 22px; font-size: 13px;
    }
    .remember-row label { margin: 0; font-size: 13px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 7px; cursor: pointer; }
    .remember-row a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .remember-row a:hover { text-decoration: underline; }

    .btn-login {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      border: none; border-radius: 10px; color: #fff;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: .2s; letter-spacing: 0.3px;
      box-shadow: 0 4px 20px rgba(108,99,255,0.4);
      position: relative; overflow: hidden;
    }
    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(108,99,255,0.55); }
    .btn-login:active { transform: translateY(0); }
    .btn-login.loading { pointer-events: none; opacity: 0.8; }
    .btn-login .spinner {
      display: none; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-login.loading .spinner { display: inline-block; }
    .btn-login.loading .btn-text { opacity: 0.7; }

    .divider { position: relative; text-align: center; margin: 22px 0; }
    .divider::before, .divider::after {
      content: ''; position: absolute; top: 50%; width: 40%; height: 1px;
      background: var(--border);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    .divider span { font-size: 12px; color: var(--muted); background: rgba(26,29,39,0.85); padding: 0 10px; position: relative; z-index: 1; }

    .demo-accounts { display: flex; flex-direction: column; gap: 8px; }
    .demo-btn {
      padding: 9px 14px; border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text); font-size: 12.5px; font-weight: 600;
      cursor: pointer; text-align: left; transition: .15s;
      display: flex; align-items: center; gap: 10px;
    }
    .demo-btn:hover { background: rgba(108,99,255,0.12); border-color: rgba(108,99,255,0.35); }
    .demo-btn .demo-role { font-size: 11px; color: var(--muted); margin-left: auto; font-weight: 500; }

    .footer-note {
      margin-top: 24px; text-align: center; font-size: 11.5px; color: var(--muted);
    }
    .footer-note a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>

<div class="bg-mesh"></div>
<div class="bg-grid"></div>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="login-wrap">
  <div class="logo-row">
    <div class="logo-icon">WC</div>
    <div>
      <div class="logo-text">WebComics</div>
      <div class="logo-sub">Admin Panel</div>
    </div>
  </div>

  <h1>Đăng Nhập Quản Trị</h1>
  <p class="sub-text">Chọn vai trò và nhập thông tin xác thực của bạn.</p>

  <!-- Role selection -->
  <div class="role-pills" role="group" aria-label="Chọn vai trò">
    <button type="button" class="role-pill active" id="role-admin" onclick="selectRole('admin')" aria-pressed="true">
      <span class="pill-icon">🛡️</span>Administrator
    </button>
    <button type="button" class="role-pill" id="role-moderator" onclick="selectRole('moderator')" aria-pressed="false">
      <span class="pill-icon">🔍</span>Moderator
    </button>
    <button type="button" class="role-pill" id="role-editor" onclick="selectRole('editor')" aria-pressed="false">
      <span class="pill-icon">✏️</span>Editor
    </button>
  </div>

  <form id="login-form" novalidate>
    <div class="fg">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" name="email" placeholder="admin@webcomics.com"
             autocomplete="email" required aria-required="true" />
      <div class="err-msg" id="err-email">Vui lòng nhập email hợp lệ.</div>
    </div>
    <div class="fg">
      <label for="login-password">Mật khẩu</label>
      <div class="pw-wrap">
        <input type="password" id="login-password" name="password" placeholder="••••••••"
               autocomplete="current-password" required aria-required="true" />
        <button type="button" class="pw-toggle" onclick="togglePw()" aria-label="Hiện/Ẩn mật khẩu">👁</button>
      </div>
      <div class="err-msg" id="err-pw">Mật khẩu phải có ít nhất 6 ký tự.</div>
    </div>

    <div class="remember-row">
      <label>
        <input type="checkbox" id="remember-me" />
        Nhớ đăng nhập
      </label>
      <a href="#" onclick="return false">Quên mật khẩu?</a>
    </div>

    <div class="err-msg show" id="err-global" style="display:none; margin-bottom:12px; text-align:center;"></div>

    <button type="submit" class="btn-login" id="login-btn">
      <div class="spinner"></div>
      <span class="btn-text">🔐 Đăng Nhập</span>
    </button>
  </form>

  <div class="divider"><span>Đăng nhập nhanh (Demo)</span></div>

  <div class="demo-accounts">
    <button type="button" class="demo-btn" onclick="quickLogin('admin')" aria-label="Đăng nhập nhanh với tài khoản Administrator">
      🛡️ <span>admin@webcomics.com</span>
      <span class="demo-role">Administrator</span>
    </button>
    <button type="button" class="demo-btn" onclick="quickLogin('moderator')" aria-label="Đăng nhập nhanh với tài khoản Moderator">
      🔍 <span>moderator@webcomics.com</span>
      <span class="demo-role">Moderator</span>
    </button>
    <button type="button" class="demo-btn" onclick="quickLogin('editor')" aria-label="Đăng nhập nhanh với tài khoản Editor">
      ✏️ <span>editor@webcomics.com</span>
      <span class="demo-role">Editor</span>
    </button>
  </div>

  <p class="footer-note">
    <a href="index.html">← Quay về trang đọc truyện</a>
  </p>
</div>

<script src="admin-store.js"></script>
<script>
  // Nếu đã đăng nhập thì redirect về dashboard
  if (Auth.isLoggedIn()) {
    window.location.href = 'admin.html';
  }

  let selectedRole = 'admin';

  function selectRole(role) {
    selectedRole = role;
    document.querySelectorAll('.role-pill').forEach(function(p) {
      p.classList.remove('active');
      p.setAttribute('aria-pressed', 'false');
    });
    const el = document.getElementById('role-' + role);
    if (el) { el.classList.add('active'); el.setAttribute('aria-pressed', 'true'); }

    const emailMap = {
      admin: 'admin@webcomics.com',
      moderator: 'moderator@webcomics.com',
      editor: 'editor@webcomics.com'
    };
    document.getElementById('login-email').value = emailMap[role] || '';
  }

  function togglePw() {
    const inp = document.getElementById('login-password');
    const btn = document.querySelector('.pw-toggle');
    if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
    else { inp.type = 'password'; btn.textContent = '👁'; }
  }

  function quickLogin(role) {
    selectRole(role);
    const nameMap = { admin: 'Admin Manager', moderator: 'Moderator_01', editor: 'Editor_01' };
    const emailMap = { admin: 'admin@webcomics.com', moderator: 'moderator@webcomics.com', editor: 'editor@webcomics.com' };
    doLogin(nameMap[role], emailMap[role], role);
  }

  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const pw = document.getElementById('login-password').value;
    let valid = true;

    document.getElementById('err-email').classList.remove('show');
    document.getElementById('err-pw').classList.remove('show');
    document.getElementById('err-global').style.display = 'none';

    if (!email || !email.includes('@')) {
      document.getElementById('err-email').classList.add('show'); valid = false;
    }
    if (!pw || pw.length < 6) {
      document.getElementById('err-pw').classList.add('show'); valid = false;
    }
    if (!valid) return;

    // Demo: accept any password >= 6 chars
    const nameMap = { admin: 'Admin Manager', moderator: 'Moderator_01', editor: 'Editor_01' };
    doLogin(nameMap[selectedRole] || 'Admin', email, selectedRole);
  });

  function doLogin(name, email, role) {
    const btn = document.getElementById('login-btn');
    btn.classList.add('loading');

    setTimeout(function() {
      Auth.setSession({ name: name, email: email, role: role });
      AdminStore.audit.log('LOGIN', 'Auth', email, name);
      // Redirect
      const redir = new URLSearchParams(window.location.search).get('redirect') || 'admin.html';
      window.location.href = redir;
    }, 700);
  }
</script>
</body>
</html>
