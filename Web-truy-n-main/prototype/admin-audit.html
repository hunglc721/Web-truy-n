<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nhật ký hoạt động — WebComics Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--sidebar-w:230px;--topbar-h:58px;--bg:#0d0f14;--sidebar-bg:#13161e;--card:#1a1d27;--border:rgba(255,255,255,0.07);--text:#e4e6f0;--muted:#7b7f9e;--primary:#6c63ff;--danger:#ef4444;--success:#22c55e;--warning:#f59e0b;--info:#3b82f6;--radius:10px}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
    .sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:100}
    .brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--border);text-decoration:none}
    .brand-icon{width:34px;height:34px;background:linear-gradient(135deg,#6c63ff,#ff2a6d);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff}
    .brand-text{font-weight:800;font-size:14px;color:var(--text)}.brand-sub{font-size:10px;color:var(--muted)}
    .nav{padding:10px 8px;flex:1;overflow-y:auto}
    .nav-sec{font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:10px 8px 5px}
    .nav-link{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;margin-bottom:2px;transition:.15s}
    .nav-link:hover{background:rgba(108,99,255,.12);color:var(--text)}.nav-link.active{background:rgba(108,99,255,.18);color:var(--primary);font-weight:600}.nav-link svg{width:15px;height:15px;flex-shrink:0}
    .sidebar-footer{padding:10px 8px;border-top:1px solid var(--border)}
    .user-pill{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;background:rgba(255,255,255,.04)}
    .user-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6c63ff,#ff2a6d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
    .user-name{font-size:12.5px;font-weight:600}.user-role{font-size:10.5px;color:var(--primary)}
    .topbar{position:fixed;top:0;left:var(--sidebar-w);right:0;height:var(--topbar-h);background:var(--sidebar-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:90}
    .breadcrumb{font-size:13px;color:var(--muted)}.breadcrumb span{color:var(--text);font-weight:600}
    .topbar-right{display:flex;gap:10px;align-items:center}
    .tbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none;border:none;transition:.15s}
    .tbtn-ghost{background:rgba(255,255,255,.06);color:var(--text)}.tbtn-ghost:hover{background:rgba(255,255,255,.1)}
    .tbtn-danger{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2)}.tbtn-danger:hover{background:rgba(239,68,68,.25)}
    .main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:24px 24px 60px;min-height:calc(100vh - var(--topbar-h));width:calc(100% - var(--sidebar-w))}
    .ph{margin-bottom:20px}.ph h1{font-size:21px;font-weight:800}.ph p{font-size:13px;color:var(--muted);margin-top:4px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
    .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px}
    .card-title{font-size:15px;font-weight:700}
    .filters-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .search-input{flex:1;min-width:180px;padding:9px 13px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:.2s}
    .search-input:focus{border-color:var(--primary)}.search-input::placeholder{color:var(--muted)}
    select{padding:9px 12px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;outline:none;cursor:pointer}
    select option{background:#1a1d27}
    .overflow-x{overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    th{background:rgba(255,255,255,.04);padding:10px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);text-align:left;border-bottom:1px solid var(--border)}
    td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(255,255,255,.02)}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;font-family:monospace;white-space:nowrap}
    .badge-create{background:rgba(34,197,94,.15);color:var(--success)}
    .badge-update{background:rgba(59,130,246,.15);color:#60a5fa}
    .badge-delete{background:rgba(239,68,68,.15);color:#f87171}
    .badge-login{background:rgba(108,99,255,.15);color:var(--primary)}
    .badge-logout{background:rgba(245,158,11,.15);color:var(--warning)}
    .badge-perm{background:rgba(255,255,255,.1);color:var(--muted)}
    .target-text{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12.5px}
    .pagination{display:flex;align-items:center;gap:8px;padding-top:14px;border-top:1px solid var(--border);flex-wrap:wrap}
    .page-info{font-size:12.5px;color:var(--muted);flex:1}
    .page-btn{padding:5px 11px;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
    .page-btn:hover{background:rgba(255,255,255,.1)}.page-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}.page-btn:disabled{opacity:.4;cursor:default}
    .empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
    .action-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
    .dot-create{background:var(--success)}.dot-update{background:#60a5fa}.dot-delete{background:#f87171}.dot-login{background:var(--primary)}.dot-logout{background:var(--warning)}.dot-perm{background:var(--muted)}
  </style>
</head>
<body>
<div id="sidebar-container"></div>
<header class="topbar">
  <div class="breadcrumb">Admin / <span>Nhật ký Hoạt động</span></div>
  <div class="topbar-right">
    <button class="tbtn tbtn-danger" onclick="clearLog()">🗑️ Xóa Log</button>
    <button class="tbtn tbtn-ghost" style="color:#f87171" onclick="doLogout()">✕ Đăng xuất</button>
  </div>
</header>
<main class="main">
  <div class="ph"><h1>📋 Nhật ký Hoạt động (Audit Log)</h1><p>Theo dõi mọi thao tác CRUD, đăng nhập/xuất của tất cả admin viên.</p></div>
  <div class="card">
    <div class="card-header">
      <span class="card-title">📋 Lịch sử hành động</span>
      <span id="count-lbl" style="font-size:12px;color:var(--muted)"></span>
    </div>
    <div class="filters-row">
      <input type="search" class="search-input" id="audit-search" placeholder="🔍 Tìm theo actor, target, module..." oninput="applyFilters()" />
      <select id="filter-action" onchange="applyFilters()">
        <option value="">Tất cả hành động</option>
        <option value="CREATE">CREATE</option>
        <option value="UPDATE">UPDATE</option>
        <option value="DELETE">DELETE</option>
        <option value="LOGIN">LOGIN</option>
        <option value="LOGOUT">LOGOUT</option>
        <option value="PERMISSION">PERMISSION</option>
      </select>
      <select id="filter-module" onchange="applyFilters()">
        <option value="">Tất cả module</option>
        <option value="Comics">Comics</option>
        <option value="Chapters">Chapters</option>
        <option value="Auth">Auth</option>
        <option value="Banners">Banners</option>
        <option value="Settings">Settings</option>
        <option value="Permissions">Permissions</option>
      </select>
    </div>
    <div class="overflow-x">
      <table>
        <thead><tr>
          <th>Thời gian</th>
          <th>Admin</th>
          <th>Hành động</th>
          <th>Module</th>
          <th>Đối tượng</th>
          <th>IP</th>
        </tr></thead>
        <tbody id="audit-tbody"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>
</main>
<script src="admin-store.js"></script>
<script>
  Auth.guard();
  document.getElementById('sidebar-container').innerHTML = buildAdminSidebar('audit');
  Auth.syncSidebar();
  function doLogout(){Auth.clearSession();window.location.href='admin-login.html';}

  const PAGE_SIZE=30;
  var allLogs=[],filtered=[],currentPage=1;

  function actionBadge(a){
    var cls={'CREATE':'badge-create','UPDATE':'badge-update','DELETE':'badge-delete','LOGIN':'badge-login','LOGOUT':'badge-logout','PERMISSION':'badge-perm'}[a]||'badge-perm';
    return '<span class="badge '+cls+'">'+escapeHtml(a)+'</span>';
  }

  function loadData(){
    allLogs=AdminStore.audit.getAll();
    applyFilters();
  }

  function applyFilters(){
    var q=(document.getElementById('audit-search').value||'').trim().toLowerCase();
    var act=document.getElementById('filter-action').value;
    var mod=document.getElementById('filter-module').value;
    filtered=allLogs.filter(function(l){
      var mq=!q||(l.actor||'').toLowerCase().includes(q)||(l.target||'').toLowerCase().includes(q)||(l.module||'').toLowerCase().includes(q);
      var ma=!act||l.action===act;
      var mm=!mod||l.module===mod;
      return mq&&ma&&mm;
    });
    currentPage=1;
    render();renderPagination();
  }

  function render(){
    var tbody=document.getElementById('audit-tbody');
    document.getElementById('count-lbl').textContent=filtered.length+' entries';
    if(!filtered.length){tbody.innerHTML='<tr><td colspan="6"><div class="empty-state"><div style="font-size:40px">📭</div><p>Không tìm thấy log nào.</p></div></td></tr>';return;}
    var start=(currentPage-1)*PAGE_SIZE,end=Math.min(start+PAGE_SIZE,filtered.length);
    tbody.innerHTML=filtered.slice(start,end).map(function(l){
      return '<tr>'+
        '<td style="font-size:12px;color:var(--muted);white-space:nowrap">'+formatDate(l.ts)+'</td>'+
        '<td><div style="font-weight:600;font-size:13px">'+escapeHtml(l.actor||'System')+'</div></td>'+
        '<td>'+actionBadge(l.action||'—')+'</td>'+
        '<td style="font-size:12.5px;color:var(--muted)">'+escapeHtml(l.module||'—')+'</td>'+
        '<td><div class="target-text" title="'+escapeHtml(l.target||'')+'">'+escapeHtml(l.target||'—')+'</div></td>'+
        '<td style="font-size:11.5px;color:var(--muted);font-family:monospace">'+escapeHtml(l.ip||'—')+'</td>'+
      '</tr>';
    }).join('');
  }

  function renderPagination(){
    var total=filtered.length,pages=Math.ceil(total/PAGE_SIZE);
    var pg=document.getElementById('pagination');
    if(pages<=1){pg.innerHTML='';return;}
    var start=(currentPage-1)*PAGE_SIZE+1,end=Math.min(currentPage*PAGE_SIZE,total);
    var h='<div class="page-info">'+start+'–'+end+' / '+total+'</div>';
    h+='<button class="page-btn" '+(currentPage===1?'disabled':'')+' onclick="goPage('+(currentPage-1)+')">← Trước</button>';
    for(var i=1;i<=pages;i++){if(pages<=7||i===1||i===pages||Math.abs(i-currentPage)<=1)h+='<button class="page-btn '+(i===currentPage?'active':'')+'" onclick="goPage('+i+')">'+i+'</button>'; else if(Math.abs(i-currentPage)===2)h+='<span style="color:var(--muted)">…</span>';}
    h+='<button class="page-btn" '+(currentPage===pages?'disabled':'')+' onclick="goPage('+(currentPage+1)+')">Sau →</button>';
    pg.innerHTML=h;
  }

  function goPage(n){currentPage=n;render();renderPagination();}

  function clearLog(){
    if(!confirm('Xóa toàn bộ nhật ký? Hành động này không thể hoàn tác!'))return;
    AdminStore.audit.clear();
    loadData();
    toast('Đã xóa nhật ký!','success');
  }

  document.addEventListener('DOMContentLoaded',loadData);
</script>
</body>
</html>
