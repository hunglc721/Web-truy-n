services:
  - type: web
    name: comicx-web
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://comicx-web.onrender.com
      - key: ASSET_URL
        value: https://comicx-web.onrender.com
      - key: APP_DEBUG
        value: "true"
      - key: APP_KEY
        value: base64:4roYxAVol109c7QdQ7zdsZg5bHgKxwLLtZ7WKDn9FKM=
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/laravel-blade/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
