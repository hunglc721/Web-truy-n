<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch ra truyện — WebComics Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--sidebar-w:230px;--topbar-h:58px;--bg:#0d0f14;--sidebar-bg:#13161e;--card:#1a1d27;--border:rgba(255,255,255,0.07);--text:#e4e6f0;--muted:#7b7f9e;--primary:#6c63ff;--danger:#ef4444;--success:#22c55e;--warning:#f59e0b;--radius:10px}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
    .sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:100}
    .brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--border);text-decoration:none}
    .brand-icon{width:34px;height:34px;background:linear-gradient(135deg,#6c63ff,#ff2a6d);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff}
    .brand-text{font-weight:800;font-size:14px;color:var(--text)}.brand-sub{font-size:10px;color:var(--muted)}
    .nav{padding:10px 8px;flex:1;overflow-y:auto}
    .nav-sec{font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:10px 8px 5px}
    .nav-link{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;margin-bottom:2px;transition:.15s}
    .nav-link:hover{background:rgba(108,99,255,.12);color:var(--text)}.nav-link.active{background:rgba(108,99,255,.18);color:var(--primary);font-weight:600}.nav-link svg{width:15px;height:15px;flex-shrink:0}
    .sidebar-footer{padding:10px 8px;border-top:1px solid var(--border)}
    .user-pill{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;background:rgba(255,255,255,.04)}
    .user-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6c63ff,#ff2a6d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
    .user-name{font-size:12.5px;font-weight:600}.user-role{font-size:10.5px;color:var(--primary)}
    .topbar{position:fixed;top:0;left:var(--sidebar-w);right:0;height:var(--topbar-h);background:var(--sidebar-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:90}
    .breadcrumb{font-size:13px;color:var(--muted)}.breadcrumb span{color:var(--text);font-weight:600}
    .topbar-right{display:flex;gap:10px;align-items:center}
    .tbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none;border:none;transition:.15s}
    .tbtn-primary{background:var(--primary);color:#fff}.tbtn-primary:hover{background:#574fd6}
    .tbtn-ghost{background:rgba(255,255,255,.06);color:var(--text)}.tbtn-ghost:hover{background:rgba(255,255,255,.1)}
    .main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:24px 24px 60px;min-height:calc(100vh - var(--topbar-h));width:calc(100% - var(--sidebar-w))}
    .ph{margin-bottom:20px}.ph h1{font-size:21px;font-weight:800}.ph p{font-size:13px;color:var(--muted);margin-top:4px}
    .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
    .day-col{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;min-height:160px}
    .day-header{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
    .day-today .day-col{border-color:rgba(108,99,255,.4);background:rgba(108,99,255,.06)}
    .day-today .day-header-name{color:var(--primary)}
    .sched-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;background:rgba(255,255,255,.04);border:1px solid var(--border);margin-bottom:6px;position:relative}
    .sched-cover{width:28px;height:38px;object-fit:cover;border-radius:4px;flex-shrink:0}
    .sched-cover-ph{width:28px;height:38px;border-radius:4px;background:rgba(108,99,255,.15);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
    .sched-name{font-size:11.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .sched-time{font-size:10.5px;color:var(--muted)}
    .sched-del{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:4px;background:rgba(239,68,68,.2);border:none;color:#f87171;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s}
    .sched-item:hover .sched-del{opacity:1}
    .add-sched-btn{width:100%;padding:6px;border-radius:6px;background:rgba(108,99,255,.08);border:1px dashed rgba(108,99,255,.3);color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer;text-align:center;transition:.15s;margin-top:4px}
    .add-sched-btn:hover{background:rgba(108,99,255,.15);color:var(--primary)}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(5px);z-index:999;align-items:center;justify-content:center}
    .modal-overlay.show{display:flex}
    .modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:26px 28px;width:90%;max-width:480px}
    .modal-title{font-size:17px;font-weight:800;margin-bottom:4px}
    .modal-sub{font-size:13px;color:var(--muted);margin-bottom:22px}
    .modal-actions{display:flex;gap:10px;margin-top:20px}
    .fg{margin-bottom:14px}
    label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
    select,input[type=time]{width:100%;padding:10px 13px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13.5px;outline:none;transition:.2s}
    select:focus,input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,99,255,.15)}
    select option{background:#1a1d27}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.15s}
    .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#574fd6}
    .btn-ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border)}.btn-ghost:hover{background:rgba(255,255,255,.1)}
    @media(max-width:900px){.week-grid{grid-template-columns:repeat(3,1fr)}.main{padding:16px 12px 40px}}
    @media(max-width:600px){.week-grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div id="sidebar-container"></div>
<header class="topbar">
  <div class="breadcrumb">Admin / <span>Lịch ra truyện</span></div>
  <div class="topbar-right">
    <button class="tbtn tbtn-primary" onclick="openAddModal()">+ Thêm lịch</button>
    <button class="tbtn tbtn-ghost" style="color:#f87171" onclick="doLogout()">✕ Đăng xuất</button>
  </div>
</header>
<main class="main">
  <div class="ph"><h1>📅 Lịch Ra Truyện Tuần</h1><p>Quản lý lịch phát hành chapter theo từng ngày trong tuần. Hỗ trợ nhiều truyện mỗi ngày.</p></div>
  <div class="week-grid" id="week-grid"></div>
</main>
<div class="modal-overlay" id="sched-modal">
  <div class="modal-box">
    <div class="modal-title">📅 Thêm Lịch Ra Truyện</div>
    <div class="modal-sub" id="sched-modal-sub">Chọn truyện và ngày phát hành.</div>
    <div class="fg">
      <label>Bộ truyện</label>
      <select id="sched-comic-sel"><option value="">— Chọn bộ truyện —</option></select>
    </div>
    <div class="fg">
      <label>Ngày trong tuần</label>
      <select id="sched-day-sel">
        <option value="monday">Thứ Hai</option><option value="tuesday">Thứ Ba</option>
        <option value="wednesday">Thứ Tư</option><option value="thursday">Thứ Năm</option>
        <option value="friday">Thứ Sáu</option><option value="saturday">Thứ Bảy</option>
        <option value="sunday">Chủ Nhật</option>
      </select>
    </div>
    <div class="fg">
      <label>Giờ phát hành</label>
      <input type="time" id="sched-time" value="20:00" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="saveSchedule()">💾 Lưu lịch</button>
      <button class="btn btn-ghost" onclick="closeModal('sched-modal')">Hủy</button>
    </div>
  </div>
</div>
<script src="admin-store.js"></script>
<script>
  Auth.guard();
  document.getElementById('sidebar-container').innerHTML = buildAdminSidebar('schedules');
  Auth.syncSidebar();
  function doLogout(){Auth.clearSession();window.location.href='admin-login.html';}

  const DAYS=[{key:'monday',label:'Thứ Hai',short:'T2'},{key:'tuesday',label:'Thứ Ba',short:'T3'},{key:'wednesday',label:'Thứ Tư',short:'T4'},{key:'thursday',label:'Thứ Năm',short:'T5'},{key:'friday',label:'Thứ Sáu',short:'T6'},{key:'saturday',label:'Thứ Bảy',short:'T7'},{key:'sunday',label:'Chủ Nhật',short:'CN'}];
  var todayKey=(['sunday','monday','tuesday','wednesday','thursday','friday','saturday'])[new Date().getDay()];

  function loadComicSelect(){
    var comics=AdminStore.comics.getAll();
    var sel=document.getElementById('sched-comic-sel');
    sel.innerHTML='<option value="">— Chọn bộ truyện —</option>'+comics.map(function(c){return '<option value="'+c.id+'">'+escapeHtml(c.title)+'</option>';}).join('');
  }

  function render(){
    var grid=document.getElementById('week-grid');
    var scheds=AdminStore.schedules.getAll();
    grid.innerHTML=DAYS.map(function(d){
      var isToday=d.key===todayKey;
      var items=scheds.filter(function(s){return s.day===d.key;});
      var itemsHtml=items.map(function(s){
        var cover=s.comicCover?'<img src="'+escapeHtml(s.comicCover)+'" class="sched-cover" alt="" />'+'<button class="sched-del" onclick="delSched(\''+s.id+'\')" aria-label="Xóa lịch" title="Xóa">✕</button>':'<div class="sched-cover-ph">📚</div>';
        return '<div class="sched-item">'+cover+'<div><div class="sched-name" title="'+escapeHtml(s.comicTitle||'')+'">'+escapeHtml(s.comicTitle||'—')+'</div><div class="sched-time">⏰ '+escapeHtml(s.time||'—')+'</div></div><button class="sched-del" onclick="delSched(\''+s.id+'\')" aria-label="Xóa lịch" title="Xóa">✕</button></div>';
      }).join('');
      return '<div class="'+(isToday?'day-today':'')+'"><div class="day-col">'+
        '<div class="day-header"><span class="day-header-name" style="font-weight:800;font-size:13px">'+(isToday?'⭐ ':'')+d.label+'</span><span class="badge" style="background:rgba(255,255,255,.08);color:var(--muted);font-size:10px">'+items.length+'</span></div>'+
        itemsHtml+
        '<button class="add-sched-btn" onclick="openAddModal(\''+d.key+'\')">+ Thêm lịch</button>'+
      '</div></div>';
    }).join('');
  }

  function openAddModal(day){
    loadComicSelect();
    if(day)document.getElementById('sched-day-sel').value=day;
    openModal('sched-modal');
  }

  function saveSchedule(){
    var comicId=document.getElementById('sched-comic-sel').value;
    var day=document.getElementById('sched-day-sel').value;
    var time=document.getElementById('sched-time').value;
    if(!comicId){toast('Vui lòng chọn bộ truyện!','warning');return;}
    var comic=AdminStore.comics.getById(comicId);
    AdminStore.schedules.save({comicId:comicId,comicTitle:comic?comic.title:'',comicCover:comic?comic.cover:'',day:day,time:time});
    closeModal('sched-modal');
    render();
    toast('Đã thêm lịch phát hành!','success');
  }

  function delSched(id){AdminStore.schedules.delete(id);render();toast('Đã xóa lịch!','info',2000);}

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
</script>
</body>
</html>
