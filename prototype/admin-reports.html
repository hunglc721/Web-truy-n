<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Báo cáo lỗi — WebComics Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--sidebar-w:230px;--topbar-h:58px;--bg:#0d0f14;--sidebar-bg:#13161e;--card:#1a1d27;--border:rgba(255,255,255,0.07);--text:#e4e6f0;--muted:#7b7f9e;--primary:#6c63ff;--danger:#ef4444;--success:#22c55e;--warning:#f59e0b;--radius:10px}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
    .sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:100}
    .brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--border);text-decoration:none}
    .brand-icon{width:34px;height:34px;background:linear-gradient(135deg,#6c63ff,#ff2a6d);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff}
    .brand-text{font-weight:800;font-size:14px;color:var(--text)}.brand-sub{font-size:10px;color:var(--muted)}
    .nav{padding:10px 8px;flex:1;overflow-y:auto}
    .nav-sec{font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:10px 8px 5px}
    .nav-link{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;margin-bottom:2px;transition:.15s}
    .nav-link:hover{background:rgba(108,99,255,.12);color:var(--text)}.nav-link.active{background:rgba(108,99,255,.18);color:var(--primary);font-weight:600}.nav-link svg{width:15px;height:15px;flex-shrink:0}
    .sidebar-footer{padding:10px 8px;border-top:1px solid var(--border)}
    .user-pill{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;background:rgba(255,255,255,.04)}
    .user-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6c63ff,#ff2a6d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
    .user-name{font-size:12.5px;font-weight:600}.user-role{font-size:10.5px;color:var(--primary)}
    .topbar{position:fixed;top:0;left:var(--sidebar-w);right:0;height:var(--topbar-h);background:var(--sidebar-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:90}
    .breadcrumb{font-size:13px;color:var(--muted)}.breadcrumb span{color:var(--text);font-weight:600}
    .topbar-right{display:flex;gap:10px;align-items:center}
    .tbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none;border:none;transition:.15s}
    .tbtn-ghost{background:rgba(255,255,255,.06);color:var(--text)}.tbtn-ghost:hover{background:rgba(255,255,255,.1)}
    .main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:24px 24px 60px;min-height:calc(100vh - var(--topbar-h));width:calc(100% - var(--sidebar-w))}
    .ph{margin-bottom:20px}.ph h1{font-size:21px;font-weight:800}.ph p{font-size:13px;color:var(--muted);margin-top:4px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
    .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
    .card-title{font-size:15px;font-weight:700}
    .filters-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
    .search-input{flex:1;min-width:180px;padding:9px 13px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:.2s}
    .search-input:focus{border-color:var(--primary)}.search-input::placeholder{color:var(--muted)}
    select{padding:9px 12px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;outline:none;cursor:pointer}
    select option{background:#1a1d27}
    .overflow-x{overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    th{background:rgba(255,255,255,.04);padding:10px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);text-align:left;border-bottom:1px solid var(--border)}
    td{padding:11px 12px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(255,255,255,.02)}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
    .badge-pending{background:rgba(245,158,11,.14);color:var(--warning)}
    .badge-processing{background:rgba(59,130,246,.14);color:#60a5fa}
    .badge-resolved{background:rgba(34,197,94,.14);color:var(--success)}
    .action-btns{display:flex;gap:5px;flex-wrap:wrap}
    .btn-sm{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:7px;font-size:11.5px;font-weight:600;cursor:pointer;border:none;transition:.15s;white-space:nowrap}
    .btn-process{background:rgba(59,130,246,.15);color:#60a5fa}.btn-process:hover{background:rgba(59,130,246,.3)}
    .btn-resolve{background:rgba(34,197,94,.15);color:var(--success)}.btn-resolve:hover{background:rgba(34,197,94,.3)}
    .btn-reopen{background:rgba(245,158,11,.15);color:var(--warning)}.btn-reopen:hover{background:rgba(245,158,11,.3)}
    .note-input{width:100%;padding:6px 10px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none}
    .note-input:focus{border-color:var(--primary)}
    .empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
    .flow-pills{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
    .flow-step{padding:3px 8px;border-radius:12px;font-weight:600}
    .flow-pend{background:rgba(245,158,11,.15);color:var(--warning)}
    .flow-proc{background:rgba(59,130,246,.15);color:#60a5fa}
    .flow-res{background:rgba(34,197,94,.15);color:var(--success)}
  </style>
</head>
<body>
<div id="sidebar-container"></div>
<header class="topbar">
  <div class="breadcrumb">Admin / <span>Báo cáo Lỗi Chapter</span></div>
  <div class="topbar-right">
    <button class="tbtn tbtn-ghost" style="color:#f87171" onclick="doLogout()">✕ Đăng xuất</button>
  </div>
</header>
<main class="main">
  <div class="ph"><h1>⚠️ Báo cáo Lỗi Chapter</h1><p>Xem và xử lý báo cáo lỗi từ độc giả theo luồng trạng thái 3 bước.</p></div>
  <div class="card" style="padding:12px 16px;margin-bottom:14px">
    <div class="flow-pills">
      <span style="font-size:13px;font-weight:700">Luồng xử lý:</span>
      <span class="flow-step flow-pend">⏳ Chưa xử lý</span>
      <span>→</span>
      <span class="flow-step flow-proc">🔄 Đang xử lý</span>
      <span>→</span>
      <span class="flow-step flow-res">✅ Đã khắc phục</span>
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <span class="card-title">📋 Danh sách Báo cáo</span>
      <span id="count-lbl" style="font-size:12px;color:var(--muted)"></span>
    </div>
    <div class="filters-row">
      <input type="search" class="search-input" id="rpt-search" placeholder="🔍 Tìm theo truyện, loại lỗi..." oninput="applyFilters()" />
      <select id="filter-status" onchange="applyFilters()">
        <option value="">Tất cả trạng thái</option>
        <option value="pending">Chưa xử lý</option>
        <option value="processing">Đang xử lý</option>
        <option value="resolved">Đã khắc phục</option>
      </select>
    </div>
    <div class="overflow-x">
      <table>
        <thead><tr>
          <th>Truyện / Chapter</th>
          <th>Loại lỗi</th>
          <th>Người báo</th>
          <th>Thời gian</th>
          <th>Trạng thái</th>
          <th>Ghi chú Admin</th>
          <th style="text-align:right">Hành động</th>
        </tr></thead>
        <tbody id="rpt-tbody"></tbody>
      </table>
    </div>
  </div>
</main>
<script src="admin-store.js"></script>
<script>
  Auth.guard();
  document.getElementById('sidebar-container').innerHTML = buildAdminSidebar('reports');
  Auth.syncSidebar();
  function doLogout(){Auth.clearSession();window.location.href='admin-login.html';}

  var allRpts=[], filtered=[];

  function loadData(){allRpts=AdminStore.reports.getAll();applyFilters();}

  function applyFilters(){
    var q=(document.getElementById('rpt-search').value||'').trim().toLowerCase();
    var st=document.getElementById('filter-status').value;
    filtered=allRpts.filter(function(r){
      var mq=!q||(r.comicTitle||'').toLowerCase().includes(q)||(r.type||'').toLowerCase().includes(q)||(r.chapter||'').toLowerCase().includes(q);
      var ms=!st||r.status===st;
      return mq&&ms;
    }).sort(function(a,b){return b.ts-a.ts;});
    render();
  }

  function statusBadge(s){
    if(s==='pending')return '<span class="badge badge-pending">⏳ Chưa xử lý</span>';
    if(s==='processing')return '<span class="badge badge-processing">🔄 Đang xử lý</span>';
    return '<span class="badge badge-resolved">✅ Đã khắc phục</span>';
  }
  function actionBtns(r){
    if(r.status==='pending')return '<button class="btn-sm btn-process" onclick="setStatus(\''+r.id+'\',\'processing\')">🔄 Xử lý</button>';
    if(r.status==='processing')return '<button class="btn-sm btn-resolve" onclick="setStatus(\''+r.id+'\',\'resolved\')">✅ Khắc phục</button><button class="btn-sm btn-reopen" onclick="setStatus(\''+r.id+'\',\'pending\')" style="margin-left:4px">↩ Hoàn lại</button>';
    return '<button class="btn-sm btn-reopen" onclick="setStatus(\''+r.id+'\',\'pending\')">↩ Mở lại</button>';
  }

  function render(){
    var tbody=document.getElementById('rpt-tbody');
    document.getElementById('count-lbl').textContent=filtered.length+' báo cáo';
    if(!filtered.length){tbody.innerHTML='<tr><td colspan="7"><div class="empty-state"><div style="font-size:44px">📭</div><p>Không có báo cáo nào.</p></div></td></tr>';return;}
    tbody.innerHTML=filtered.map(function(r){
      return '<tr>'+
        '<td><div style="font-weight:600">'+escapeHtml(r.comicTitle||'—')+'</div><div style="font-size:11.5px;color:var(--muted)">'+escapeHtml(r.chapter||'')+'</div></td>'+
        '<td><span style="font-size:12.5px;font-weight:600;color:var(--warning)">'+escapeHtml(r.type||'—')+'</span></td>'+
        '<td style="font-size:12.5px;color:var(--muted)">'+escapeHtml(r.reporterUser||'—')+'</td>'+
        '<td style="font-size:12px;color:var(--muted);white-space:nowrap">'+timeAgo(r.ts)+'</td>'+
        '<td>'+statusBadge(r.status)+'</td>'+
        '<td><input class="note-input" value="'+escapeHtml(r.note||'')+'" placeholder="Ghi chú phản hồi..." onblur="saveNote(\''+r.id+'\',this.value)" style="min-width:160px" /></td>'+
        '<td style="text-align:right"><div class="action-btns" style="justify-content:flex-end">'+actionBtns(r)+'</div></td>'+
      '</tr>';
    }).join('');
  }

  function setStatus(id,status){AdminStore.reports.update(id,{status:status});loadData();toast('Đã cập nhật trạng thái!','success');}
  function saveNote(id,note){AdminStore.reports.update(id,{note:note});}

  document.addEventListener('DOMContentLoaded',loadData);
</script>
</body>
</html>
